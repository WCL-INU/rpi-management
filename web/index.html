<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raspberry Pi 상태</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">Status Dashboard</p>
          <h1>Raspberry Pi 상태</h1>
        </div>
        <button id="refresh-all">전체 새로고침</button>
      </header>

      <!-- 메인 화면은 운영 상태만 보여준다. 설정 파일 정보는 별도 페이지 후보로 분리한다. -->
      <section class="summary" aria-label="상태 요약">
        <div>
          <span>등록 장비</span>
          <strong id="device-count">0</strong>
        </div>
        <div>
          <span>온라인</span>
          <strong id="online-count">-</strong>
        </div>
        <div>
          <span>오프라인</span>
          <strong id="offline-count">-</strong>
        </div>
        <div>
          <span>마지막 확인</span>
          <strong id="checked-at">-</strong>
        </div>
      </section>

      <section class="devices-section" aria-label="장비 상태 목록">
        <div class="section-head">
          <h2>장비 상태</h2>
          <p>각 장비가 현재 응답하는지와 기본 상태만 표시합니다.</p>
        </div>
        <div id="device-cards" class="device-grid"></div>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
